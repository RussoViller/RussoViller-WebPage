<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0506">
<title>RussoViller WebPage</title>
<link rel="preconnect" href="https://abacus.jasoncameron.dev" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0506; --line:rgba(255,255,255,.1); --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.09);
  --text:#fbefef; --muted:#c3a4a7; --red:#ff3b3b;
  --grad:linear-gradient(120deg,#d90f2b 0%,#ff3b3b 52%,#ff7a2f 100%);
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #ff7a6a;outline-offset:3px}

/* Fundo: duas luzes que derivam devagar */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{width:62vmax;height:62vmax;left:-22vmax;top:-26vmax;background:#d90f2b;opacity:.38;animation:drift 22s ease-in-out infinite alternate}
body::after{width:50vmax;height:50vmax;right:-18vmax;bottom:-22vmax;background:#ff6a1a;opacity:.2;animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

header{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px;background:rgba(10,5,6,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.lang{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:10px;font:inherit;font-size:.9rem;color:var(--text);background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:border-color .2s}
.dd-btn:hover,.dd-btn[aria-expanded="true"]{border-color:var(--red)}
.chev{width:7px;height:7px;border-right:2px solid var(--red);border-bottom:2px solid var(--red);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.dd-btn[aria-expanded="true"] .chev{transform:rotate(225deg) translate(-2px,-1px)}
.dd-menu{position:absolute;left:0;top:calc(100% + 10px);min-width:200px;padding:6px;background:rgba(22,8,10,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,59,59,.4);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 40px rgba(255,40,40,.2);z-index:20;animation:up .18s ease both}
.dd-menu[hidden]{display:none}
.dd-menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border:0;background:none;color:var(--text);font:inherit;font-size:.95rem;border-radius:13px;cursor:pointer;text-align:left}
.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--glass2)}
.dd-menu button[aria-selected="true"]{background:var(--grad);color:#fff;font-weight:600}
.dd-menu button[aria-selected="true"]::after{content:"✓"}
.home{
  border:0;background:var(--grad);color:#fff;font:600 .85rem var(--display);
  padding:10px 22px;border-radius:999px;cursor:pointer;box-shadow:0 6px 22px rgba(255,50,50,.35);transition:transform .15s,box-shadow .2s;
}
.home:hover{box-shadow:0 8px 28px rgba(255,70,50,.55)}
.home:active{transform:scale(.96)}

.right{display:flex;align-items:center;gap:10px}
.burger{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:border-color .2s}
.burger:hover{border-color:var(--red)}
.burger svg,.x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fl{display:inline-flex;flex:none;width:24px;height:16px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.fl svg{width:100%;height:100%;display:block}
.opt{display:flex;align-items:center;gap:12px}

.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(82vw,380px);display:flex;flex-direction:column;background:rgba(17,7,9,.98);border-left:1px solid rgba(255,59,59,.3);box-shadow:-20px 0 60px rgba(0,0,0,.6),-4px 0 50px rgba(255,40,40,.12);transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
.drawer.open{transform:none;visibility:visible;transition:transform .3s ease,visibility 0s 0s}
.drawer-top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px 22px;border-bottom:1px solid var(--line)}
.drawer-brand{display:flex;align-items:center;gap:12px}
.mini-logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font:800 1.1rem var(--display);color:#fff;box-shadow:0 4px 16px rgba(255,50,50,.4)}
.drawer-brand b{display:block;font:700 1rem var(--display)}
.drawer-brand small{color:var(--muted);letter-spacing:.14em;font-size:.68rem}
.x{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--text);display:grid;place-items:center;cursor:pointer}
.x:hover{background:var(--glass2)}
.drawer-nav{display:flex;flex-direction:column;padding:18px 12px}
.drawer-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:20px 16px;border:0;border-radius:16px;background:none;color:var(--text);font:700 1rem var(--display);letter-spacing:.03em;cursor:pointer;transition:background .2s}
.drawer-nav button:hover,.drawer-nav button:focus-visible{background:var(--glass2)}
.drawer-nav button svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.card .icon.brand{background:#fff;padding:8px}
.card .icon.brand img{object-fit:contain}
.card .icon.alt{position:relative}
.card .icon.alt img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);opacity:0;transition:opacity .6s ease}
.card .icon.alt img.on{opacity:1}

@media (max-width:520px){#langLabel{display:none}.home{padding:9px 16px}}

main{max-width:760px;margin:0 auto;padding:0 20px 72px}
.view{display:none}
.view.active{display:block;animation:viewIn calc(.38s + (var(--fade,1) - 1) * .16s) cubic-bezier(.2,.7,.2,1) backwards}
.view.saindo{animation:viewOut .18s ease forwards;pointer-events:none}
@keyframes viewIn{from{opacity:0;transform:translateY(calc(10px * var(--fade,1)));filter:blur(calc((var(--fade,1) - 1) * 2.5px))}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes heroUp{from{opacity:0;transform:translateY(calc(18px * var(--fade,1)));filter:blur(calc((var(--fade,1) - 1) * 2px))}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes viewOut{from{opacity:1}to{opacity:0;transform:translateY(-6px)}}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}

/* Início */
.hero{text-align:center;padding:64px 0 24px}
.logo{position:relative;width:112px;height:112px;margin:0 auto 28px;border-radius:50%;display:grid;place-items:center}
.logo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d90f2b,#ff7a2f,#ff3b3b,#4a0010,#d90f2b);animation:spin 7s linear infinite;filter:drop-shadow(0 0 26px rgba(255,50,50,.65))}
.logo span{position:relative;width:92%;height:92%;border-radius:50%;background:#0d0607;display:grid;place-items:center;font:800 2.8rem/1 var(--display);color:#ff5a3c;text-shadow:0 0 22px rgba(255,70,50,.7)}
.logo span{overflow:hidden}
.logo span img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}
.logo span img.on{opacity:1}
.logo.tem-foto span{color:transparent;text-shadow:none}
.hero h1{font:800 clamp(1.9rem,7.5vw,3.2rem)/1.08 var(--display);letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 10%,#ffc4ba 55%,#ff6a55);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:40ch;margin:18px auto 0;font-size:1.05rem}
.cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:36px}
.btn{
  width:min(320px,100%);padding:17px 28px;border-radius:999px;border:1px solid transparent;
  font:600 .9rem var(--display);letter-spacing:.02em;color:#fff;cursor:pointer;
  background:var(--grad);box-shadow:0 10px 30px rgba(255,50,50,.35);transition:transform .15s,box-shadow .2s,border-color .2s,background .2s;
}
.btn:hover{box-shadow:0 12px 38px rgba(255,80,50,.55)}
.btn:active{transform:scale(.97)}
.btn.glass{background:var(--glass);border-color:var(--line);box-shadow:none;backdrop-filter:blur(10px)}
.btn.glass:hover{background:var(--glass2);border-color:var(--red);box-shadow:0 0 28px rgba(255,59,59,.25)}

#inicio.active .hero>*{animation:heroUp calc(.7s + (var(--fade,1) - 1) * .2s) cubic-bezier(.2,.7,.2,1) both}
#inicio.active .hero>:nth-child(2){animation-delay:.08s}
#inicio.active .hero>:nth-child(3){animation-delay:.16s}
#inicio.active .hero>:nth-child(4){animation-delay:.26s}

/* Páginas internas */
h2{font:800 1.6rem/1.2 var(--display);margin:40px 0 8px;letter-spacing:-.01em;
  background:linear-gradient(100deg,#fff,#ff8a7a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-bottom:26px}
.back{margin-top:28px;border:1px solid var(--line);background:var(--glass);color:var(--muted);font:inherit;font-size:.9rem;padding:8px 18px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s}
.back:hover{color:var(--text);border-color:var(--red)}
.list{display:grid;gap:12px}
.card{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px 18px;
  background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px);
  font:inherit;color:inherit;cursor:pointer;transition:transform .18s,border-color .2s,background .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-2px);border-color:rgba(255,59,59,.7);background:var(--glass2);box-shadow:0 10px 34px rgba(255,40,40,.18)}
.card .icon{overflow:hidden;flex:none;width:54px;height:54px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font:700 .85rem var(--display);color:#fff;box-shadow:0 6px 18px rgba(255,50,50,.3)}
.card .icon img{width:100%;height:100%;object-fit:cover;display:block}
.card .icon.brand{background:#fff;padding:8px}
.card .icon.brand img{object-fit:contain}
.card .info{flex:1;min-width:0}
.card h3{font-size:1.05rem;font-weight:700}
.card p{color:var(--muted);font-size:.88rem}
.card::after{content:"›";flex:none;font-size:1.8rem;color:var(--red);line-height:1}

a.btn{display:block;text-align:center;text-decoration:none;width:min(100%,420px);margin:24px auto 0;line-height:1.35}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card .icon.zlicon{background:#2a1c1a;box-shadow:none;padding:7px}
.card .icon.dark{background:#2a1c1a;box-shadow:none;padding:4px}
.card .icon.dark img{object-fit:contain}
.zl-card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:26px 20px;backdrop-filter:blur(10px)}
.zl-ver{font:800 2rem/1.1 var(--display);color:#ff7a6a;word-break:break-word}
.zl-date{color:var(--muted);margin:12px 0 22px;font-size:.95rem}
.zl-lab{display:block;color:var(--muted);font:600 .7rem var(--display);letter-spacing:.12em;margin:20px 0 10px}
.zl-dd>button{display:flex;align-items:center;gap:14px;width:100%;padding:17px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-weight:600;text-align:left;cursor:pointer;transition:border-color .2s}
.zl-dd>button:hover,.zl-dd>button[aria-expanded="true"]{border-color:var(--red)}
.zl-dd>button .ic{color:var(--red)}
.zl-dd>button>span{flex:1;min-width:0}
.zl-dd>button[aria-expanded="true"] .chev{transform:rotate(225deg) translate(-2px,-1px)}
.zl-dd{position:relative;z-index:20}
.zl-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;max-height:min(330px,60vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,59,59,.5) transparent;border:1px solid rgba(255,59,59,.45);border-radius:18px;background:#120a0b;padding:6px;box-shadow:0 22px 60px rgba(0,0,0,.75);animation:ddIn .16s ease-out}
.zl-menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:13px;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.zl-menu button:hover,.zl-menu button:focus-visible{background:var(--glass2)}
.zl-menu button[aria-selected="true"]{background:rgba(255,59,59,.14)}
.zl-menu button>span{flex:1;min-width:0}
.zl-menu b{display:block;font-weight:600}
.zl-menu small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.zl-menu .ic{color:var(--red)}
.zl-ftitle{display:flex;align-items:center;gap:12px;margin:28px 0 14px;font-weight:600}
.zl-file{border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;background:rgba(0,0,0,.22)}
.zl-ftop{display:flex;align-items:center;gap:16px}
.zl-ficon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;flex:none;padding:8px}
.zl-ficon svg,.zl-ficon img{width:100%;height:100%;object-fit:cover;display:block}
.zl-ficon.tem-foto{padding:0;overflow:hidden}
.card .icon.zlicon.tem-foto{padding:0}
.zl-fname{font-weight:600;font-size:.95rem;word-break:break-all;line-height:1.3}
.zl-meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.78rem;letter-spacing:.05em;margin-top:6px}
.zl-get{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:15px;border-radius:999px;background:var(--grad);color:#fff;text-decoration:none;font:600 .88rem var(--display);box-shadow:0 10px 30px rgba(255,50,50,.35);transition:transform .15s,box-shadow .2s}
.zl-get:hover{box-shadow:0 12px 38px rgba(255,80,50,.55)}
.zl-get:active{transform:scale(.97)}
.zl-msg{color:var(--muted);text-align:center;padding:18px 0}
.zl-card .btn{display:block;margin:6px auto 0}

#github{text-transform:uppercase}
.st-prev{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.35)}
.st-prev img{max-width:100%;height:auto;image-rendering:pixelated;display:block}
.st-note{color:var(--muted);font-size:.85rem;line-height:1.4;margin-top:12px}
.zl-ficon.brand{background:#fff}
.zl-ficon.brand img{object-fit:contain}

.zl-ficon.dk{background:#2a1c1a;padding:4px}
.zl-ficon.dk img{object-fit:contain}
.wl-prev{border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.35);padding:10px;overflow:hidden}
.wl-prev video{display:block;width:100%;max-height:70vh;border-radius:12px;background:#000;object-fit:contain}
.wl-prev .zl-msg{padding:14px 6px}
.wl-prev a{color:#ff7a6a;text-decoration:underline}
#hdCard .zl-ver,#wlCard .zl-ver{font-size:1.4rem;line-height:1.25}
#hdCard .st-prev{padding:10px}
#hdCard .st-prev img{width:100%;image-rendering:auto;border-radius:12px}
#hdCard .zl-ficon{color:#ff5a4d}
.rodape{text-align:center;color:var(--muted);font-size:.78rem;padding:0 20px 28px;opacity:.7}
.rodape a{text-decoration:underline}

/* Projetos principais */
#curseMain h2,#modMain h2{font-size:clamp(1.25rem,5.4vw,1.6rem)}
.card.proj{padding:14px 18px 14px 14px}
.card.proj .icon{width:68px;height:68px;border-radius:18px;background:#1c1214;font-size:1rem;box-shadow:0 6px 20px rgba(255,50,50,.28);border:1px solid rgba(255,255,255,.1)}
.card.proj .icon img{object-fit:cover}
.card.proj h3{margin-top:2px;line-height:1.25}
.tag{display:inline-block;font:700 .6rem var(--display);letter-spacing:.12em;padding:4px 10px;border-radius:999px;background:rgba(255,59,59,.16);color:#ff9585;border:1px solid rgba(255,59,59,.38)}

/* Configurações: força do Fade in */
.fade-row{display:flex;align-items:center;gap:18px}
.fade-row output{min-width:2ch;text-align:center;font:800 2rem/1 var(--display);color:#ff7a6a;text-shadow:0 0 22px rgba(255,70,50,.6)}
#fadeRange,#volRange{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;cursor:pointer;
  background:linear-gradient(90deg,#d90f2b,#ff3b3b var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
#fadeRange::-webkit-slider-thumb,#volRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid #ff3b3b;box-shadow:0 0 20px rgba(255,59,59,.75)}
#fadeRange::-moz-range-thumb,#volRange::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid #ff3b3b;box-shadow:0 0 20px rgba(255,59,59,.75)}
#fadeRange::-moz-range-track,#volRange::-moz-range-track{background:transparent}
.fade-scale{display:flex;justify-content:space-between;margin:12px 52px 0 0;padding:0 4px;color:var(--muted);font:600 .8rem var(--display)}
.fade-btns{display:grid;gap:10px;margin-top:22px}
.fade-btns .btn{width:100%}

/* Configurações: seções, áudio e contador de visitas */
.cfg-h{display:flex;align-items:center;gap:12px;margin:30px 0 14px;font:800 .95rem var(--display);color:var(--text)}
.cfg-h:first-of-type{margin-top:4px}
.cfg-h::after{content:"";flex:1;height:1px;background:var(--line)}
.aud-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sw{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--glass2);color:var(--text);font:700 .8rem var(--display);padding:6px 8px 6px 16px;border-radius:999px;cursor:pointer;transition:border-color .2s}
.sw i{position:relative;width:44px;height:24px;border-radius:999px;background:rgba(255,255,255,.18);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{border-color:rgba(255,59,59,.65)}
.sw[aria-checked="true"] i{background:var(--grad)}
.sw[aria-checked="true"] i::after{transform:translateX(20px)}
#volOut{min-width:4.2ch;font-size:1.5rem}
.visitas{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--glass);color:var(--muted);font-size:.85rem}
.visitas[hidden]{display:none}
.visitas svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.visitas b{color:var(--text);font:700 .95rem var(--display)}

/* Mensagem do rodapé */
.about{position:relative;overflow:hidden;width:calc(100% - 40px);max-width:720px;margin:8px auto 26px;padding:28px 22px 26px;text-align:center;border-radius:28px;
  background:linear-gradient(160deg,rgba(217,15,43,.26),rgba(255,122,47,.1) 60%,rgba(255,255,255,.04));
  border:1px solid rgba(255,59,59,.5);box-shadow:0 0 54px rgba(255,40,40,.24),inset 0 0 34px rgba(255,60,50,.07)}
.about::before{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-18deg);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:135%}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.about>*{position:relative}
.about-hi{display:inline-block;font-size:2.2rem;line-height:1;transform-origin:70% 80%;animation:wave 2.6s ease-in-out infinite}
.about h3{font:800 clamp(1.15rem,5.2vw,1.55rem)/1.2 var(--display);margin:10px 0 12px;letter-spacing:-.01em;
  background:linear-gradient(100deg,#fff 5%,#ffc4ba 50%,#ff7a55);-webkit-background-clip:text;background-clip:text;color:transparent}
.about p{color:#f3dede;font-size:1rem;line-height:1.65;max-width:56ch;margin:0 auto}
.about p b{font-weight:800;background:linear-gradient(100deg,#ff6a55,#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}

.zl-ficon.mgf{font:700 .9rem var(--display);color:#ff7a6a}
.zl-menu small.pill{display:inline-block;margin-left:0;color:#ff9585}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ============ FOTOS DE PERFIL ============
   Ordem de busca: 1) arquivo seu na mesma pasta (minecraft.jpg, roblox.jpg,
   bilibili.jpg, youtube.jpg; também aceita png, jpeg, webp)
   2) busca automática pelo unavatar.io (TikTok e YouTube).
   Se nada for encontrado, fica o ícone de letras. */
const EXTS = ["jpg", "png", "jpeg", "webp"];
const AV = {
  mc:   "https://unavatar.io/tiktok/russoviller.mc?fallback=false",
  blox: "https://unavatar.io/tiktok/russoviller.blox?fallback=false",
  yt:   "https://unavatar.io/youtube/@russoviller?fallback=false"
};
const fav = d => "https://www.google.com/s2/favicons?domain=" + d + "&sz=128";
function fontes(base, avatar){
  const l = EXTS.map(e => base + "." + e);
  if (avatar) l.push(...[].concat(avatar));
  return l;
}
function achar(lista){
  return new Promise(res => {
    let i = 0;
    (function tentar(){
      if (i >= lista.length) return res(null);
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => { i++; tentar(); };
      img.src = lista[i];
    })();
  });
}
async function mostrarFoto(box, item){
  const img = await achar(fontes(item.foto, item.avatar));
  if (!img) return;
  img.alt = ""; box.textContent = ""; box.appendChild(img);
  if (item.brand) box.classList.add("brand");
}

/* Foto do servidor pela API pública de convites do Discord.
   Se falhar (sem internet, convite expirado), fica o ícone padrão. */
async function carregarIcone(code, box){
  try{
    const r = await fetch("https://discord.com/api/v9/invites/" + encodeURIComponent(code));
    if (!r.ok) return;
    const g = (await r.json()).guild;
    if (!g || !g.icon) return;
    const ext = g.icon.startsWith("a_") ? "gif" : "png";
    const img = new Image();
    img.alt = "";
    img.onload = () => { box.textContent = ""; box.appendChild(img); };
    img.src = "https://cdn.discordapp.com/icons/" + g.id + "/" + g.icon + "." + ext + "?size=128";
  }catch(e){}
}

function montar(id, itens){
  const box = document.getElementById(id);
  itens.forEach(i => {
    const a = document.createElement(i.go ? "button" : "a");
    a.className = "card";
    if (i.go){ a.type = "button"; a.dataset.go = i.go; }
    else { a.href = i.url; a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = `<div class="icon" aria-hidden="true">${esc(i.icone)}</div>
      <div class="info"><h3 data-t="${i.t}"></h3><p data-t="${i.d}"></p></div>`;
    box.appendChild(a);
    if (i.code) carregarIcone(i.code, a.querySelector(".icon"));
    if (i.foto) mostrarFoto(a.querySelector(".icon"), i);
  });
}

function carregarImg(lista){
  return new Promise(res => {
    let k = 0;
    (function tentar(){
      if (k >= lista.length) return res(null);
      const im = new Image();
      im.referrerPolicy = "no-referrer";
      im.onload = () => res(im);
      im.onerror = () => { k++; tentar(); };
      im.src = lista[k];
    })();
  });
}
function montarProjetos(id, itens){
  const box = document.getElementById(id);
  itens.forEach(p => {
    const a = document.createElement("a");
    a.className = "card proj";
    a.href = p.url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<div class="icon" aria-hidden="true">${esc(p.sigla)}</div>
      <div class="info"><span class="tag" data-t="${p.tipo}"></span><h3>${esc(p.t)}</h3><p data-t="${p.d}"></p></div>`;
    box.appendChild(a);
    const icone = a.querySelector(".icon");
    carregarImg([p.img].concat(EXTS.map(e => p.foto + "." + e))).then(im => {
      if (!im) return;
      im.alt = ""; icone.textContent = ""; icone.appendChild(im);
    });
  });
}

let irTimer = null;
function ir(id, rapido){
  if (!document.getElementById(id)) id = "inicio";
  const novo = document.getElementById(id);
  const views = document.querySelectorAll(".view");
  const velho = document.querySelector(".view.active:not(.saindo)");
  history.replaceState(null, "", "#" + id);
  if (id === "zl2") zlCarregar();
  if (id === "setas") stCarregar();
  if (id === "wall") wlCarregar();
  if (id === "hud") hdCarregar();
  if (id === "mg") mgCarregar();
  const mostrar = () => {
    views.forEach(v => v.classList.remove("saindo"));
    views.forEach(v => v.classList.toggle("active", v === novo));
    window.scrollTo(0, 0);
  };
  clearTimeout(irTimer); irTimer = null;
  const reduz = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (rapido || reduz || !velho || velho === novo){ mostrar(); return; }
  velho.classList.add("saindo");
  irTimer = setTimeout(mostrar, 180);
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => ir(b.dataset.go)));

/* ============ FOTO DO LOGO ============
   Troca a cada 15 s, seguindo o relógio: quem abrir o site vê a foto
   que corresponde àquele momento (todo mundo vê a mesma ao mesmo tempo). */
const FOTOS = [fontes("minecraft", AV.mc), fontes("roblox", AV.blox)];
const INTERVALO = 15000; /* 15 segundos */

async function iniciarFotos(){
  const box = document.getElementById("logoFoto");
  const imgs = (await Promise.all(FOTOS.map(achar))).filter(Boolean);
  if (!imgs.length) return;
  const indice = () => Math.floor(Date.now() / INTERVALO) % imgs.length;
  let atual = indice();
  imgs.forEach((img, k) => { img.alt = ""; if (k === atual) img.className = "on"; box.appendChild(img); });
  box.parentElement.classList.add("tem-foto");
  if (imgs.length < 2) return;
  setInterval(() => {
    const novo = indice();
    if (novo === atual) return;
    imgs[atual].classList.remove("on");
    atual = novo;
    imgs[atual].classList.add("on");
  }, 1000);
}
iniciarFotos();

/* Ícone de "Curseforge e Modrinth": alterna a cada 3 s (segue o relógio) */
async function alternarIcone(box, listas, intervalo){
  const imgs = (await Promise.all(listas.map(achar))).filter(Boolean);
  if (!imgs.length) return;
  box.textContent = "";
  box.classList.add("brand", "alt");
  const indice = () => Math.floor(Date.now() / intervalo) % imgs.length;
  let atual = indice();
  imgs.forEach((img, k) => { img.alt = ""; if (k === atual) img.className = "on"; box.appendChild(img); });
  if (imgs.length < 2) return;
  setInterval(() => {
    const novo = indice();
    if (novo === atual) return;
    imgs[atual].classList.remove("on");
    atual = novo;
    imgs[atual].classList.add("on");
  }, 500);
}

  if (drawer.classList.contains("open") === abrir) return;

  scrim.classList.toggle("open", abrir);

  menuBtn.setAttribute("aria-expanded", abrir);
  document.body.style.overflow = abrir ? "hidden" : "";
  (abrir ? document.getElementById("menuClose") : menuBtn).focus();
}

const ZL_ARQS = [
  { id: "all",       nome: t => t.zlAll, desc: t => t.zlAllD },
  { id: "universal", nome: t => t.zlUni, desc: t => t.zlUniD },
  { id: "arm64",     nome: () => "ARM64",  desc: t => t.zlArm64D },
  { id: "armv7",     nome: () => "ARMv7",  desc: t => t.zlArmv7D },
  { id: "x86",       nome: () => "x86",    desc: t => t.zlX86D },
  { id: "x86_64",    nome: () => "x86-64", desc: t => t.zlX8664D }
];
function arqDe(nome){
  const n = nome.toLowerCase();
  if (/arm64|aarch64|v8a/.test(n)) return "arm64";
  if (/armeabi|armv7|v7a|arm32/.test(n)) return "armv7";
  if (/x86[_-]?64|x64|amd64/.test(n)) return "x86_64";
  if (/x86|i[3-6]86/.test(n)) return "x86";
  return "universal";
}
const zl = { rel: null, carregando: false, t: 0, arq: null, oa: false, os: false };

function zlRender(){
  const el = document.getElementById("zlCard");
  if (!el) return;
  const t = T[lang];
  if (!zl.rel){
    el.innerHTML = zl.carregando
      ? '<p class="zl-msg">' + esc(t.zlLoading) + '</p>'
      : '<p class="zl-msg">' + esc(t.zlError) + '</p><button type="button" class="btn" data-act="retry">' + esc(t.zlRetry) + '</button>';
    return;
  }
  const r = zl.rel;
  const lista = ZL_ARQS.filter(a => a.id === "all" || r.files.some(f => f.arq === a.id));
  if (!lista.some(a => a.id === zl.arq)) zl.arq = lista.some(a => a.id === "arm64") ? "arm64" : "all";
  const atual = lista.find(a => a.id === zl.arq);
  const fl = HTMLLANG[lang];
  const data = r.date ? new Date(r.date).toLocaleDateString(fl, { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  const arqs = lista.map(a => '<button type="button" role="option" data-act="pick" data-id="' + a.id + '" aria-selected="' + (a.id === zl.arq) + '"><span><b>' + esc(a.nome(t)) + '</b><small>' + esc(a.desc(t)) + '</small></span>' + (a.id === zl.arq ? IC.ok : "") + '</button>').join("");
  const arquivos = r.files.filter(f => zl.arq === "all" || f.arq === zl.arq).map(f => {
    const mb = (f.size / 1048576).toLocaleString(fl, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return '<div class="zl-file"><div class="zl-ftop"><div class="zl-ficon' + (zlFoto ? " tem-foto" : "") + '">' + zlIco() + '</div><div><div class="zl-fname">' + esc(f.name) + '</div><div class="zl-meta"><span>' + mb + ' MB</span><span>' + f.dl.toLocaleString(fl) + ' ' + esc(t.zlDl) + '</span></div></div></div>'
      + '<a class="zl-get" href="' + esc(f.url) + '" rel="noopener">' + esc(t.zlGet) + ' ' + IC.ext + '</a></div>';
  }).join("") || '<p class="zl-msg">' + esc(t.zlNone) + '</p>';
  el.innerHTML =
    '<div class="zl-ver">' + esc(r.tag) + '</div>' +
    '<div class="zl-date">' + esc(t.zlPub) + ' ' + esc(data) + '</div>' +
    '<span class="zl-lab">' + esc(t.zlArch) + '</span>' +
    '<div class="zl-dd"><button type="button" data-act="arch" aria-expanded="' + zl.oa + '">' + IC.phone + '<span>' + esc(atual.nome(t)) + '</span><i class="chev"></i></button>' +
      (zl.oa ? '<div class="zl-menu" role="listbox">' + arqs + '</div>' : '') + '</div>' +
    '<span class="zl-lab">' + esc(t.zlSource) + '</span>' +
    '<div class="zl-dd"><button type="button" data-act="src" aria-expanded="' + zl.os + '">' + IC.globe + '<span>' + esc(t.zlGithub) + '</span><i class="chev"></i></button>' +
      (zl.os ? '<div class="zl-menu" role="listbox"><button type="button" role="option" data-act="pickSrc" aria-selected="true"><span><b>' + esc(t.zlGithub) + '</b></span>' + IC.ok + '</button></div>' : '') + '</div>' +
    '<div class="zl-ftitle">' + IC.down + '<span>' + esc(t.zlFiles) + '</span></div>' + arquivos;
}

async function zlCarregar(forcar){
  if (zl.carregando) return;
  if (zl.rel && !forcar && Date.now() - zl.t < 300000) return;
  zl.carregando = true; zlRender();
  try{
    const r = await fetch(ZL_API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    let as = j.assets || [];
    const apks = as.filter(a => /\.apk$/i.test(a.name));
    if (apks.length) as = apks;
    zl.rel = {
      tag: String(j.tag_name || j.name || "").replace(/^v/i, ""),
      date: j.published_at,
      files: as.map(a => ({ name: a.name, size: a.size, dl: a.download_count, url: a.browser_download_url, arq: arqDe(a.name) }))
    };
    zl.t = Date.now();
  }catch(e){}
  zl.carregando = false; zlRender();
}
document.getElementById("zlCard").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "retry"){ zlCarregar(true); return; }
  if (a === "arch"){ zl.oa = !zl.oa; zl.os = false; }
  else if (a === "src"){ zl.os = !zl.os; zl.oa = false; }
  else if (a === "pick"){ zl.arq = b.dataset.id; zl.oa = false; }
  else if (a === "pickSrc"){ zl.os = false; }
  zlRender();
});

const ST_API = "https://api.github.com/repos/RussoViller/Setinhas-Animadas/releases?per_page=100";
IC.user = '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
const st = { rels: null, carregando: false, t: 0, sel: null, open: false };

function stParse(body){
  body = body || "";
  const imgs = [];
  const re = /!\[[^\]]*\]\(\s*<?([^)\s>]+)>?[^)]*\)|<img\b[^>]*?\bsrc=["']([^"']+)["']/gi;
  let m;
  while ((m = re.exec(body))) imgs.push({ pos: m.index, url: m[1] || m[2] });
  const heads = [];
  const hre = /^#{1,6}\s*(.+?)\s*$/gm;
  while ((m = hre.exec(body))) heads.push({ pos: m.index, text: m[1] });
  const sp = heads.find(h => /variante|variant/i.test(h.text) && /preview/i.test(h.text));
  let main, vars;
  if (sp){
    main = imgs.filter(i => i.pos < sp.pos).map(i => i.url);
    vars = imgs.filter(i => i.pos > sp.pos).map(i => i.url);
  } else {
    main = imgs.slice(0, 1).map(i => i.url);
    vars = imgs.slice(1).map(i => i.url);
  }
  const nota = heads.filter(h => !/preview/i.test(h.text)).map(h => h.text).join(" ");
  return { main, vars, nota };
}

function stRender(){
  const el = document.getElementById("stCard");
  if (!el) return;
  const t = T[lang];
  if (!st.rels){
    el.innerHTML = st.carregando
      ? '<p class="zl-msg">' + esc(t.stLoading) + '</p>'
      : '<p class="zl-msg">' + esc(t.zlError) + '</p><button type="button" class="btn" data-act="retry">' + esc(t.zlRetry) + '</button>';
    return;
  }
  if (!st.rels.some(r => r.tag === st.sel)) st.sel = st.rels[0].tag;
  const r = st.rels.find(x => x.tag === st.sel);
  const fl = HTMLLANG[lang];
  const data = r.date ? new Date(r.date).toLocaleDateString(fl, { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  const menu = st.rels.map(x => '<button type="button" role="option" data-act="pick" data-id="' + esc(x.tag) + '" aria-selected="' + (x.tag === st.sel) + '"><span><b>' + esc(x.nome) + '</b></span>' + (x.tag === st.sel ? IC.ok : "") + '</button>').join("");
  const imgs = a => a.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy" referrerpolicy="no-referrer">').join("");
  const prev = (rotulo, a) => '<span class="zl-lab">' + esc(rotulo) + '</span><div class="st-prev">' + (a.length ? imgs(a) : '<span class="zl-msg" style="padding:0">' + esc(t.stNoPrev) + '</span>') + '</div>';
  const arquivos = r.files.map(f => {
    const mb = (f.size / 1048576).toLocaleString(fl, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return '<div class="zl-file"><div class="zl-ftop"><div class="zl-ficon brand"><img src="' + SETAS_IMG + '" alt=""></div><div><div class="zl-fname">' + esc(f.name) + '</div><div class="zl-meta"><span>' + mb + ' MB</span><span>' + f.dl.toLocaleString(fl) + ' ' + esc(t.zlDl) + '</span></div></div></div>'
      + '<a class="zl-get" href="' + esc(f.url) + '" rel="noopener">' + esc(t.zlGet) + ' ' + IC.ext + '</a></div>';
  }).join("");
  el.innerHTML =
    '<div class="zl-ver">' + esc(r.nome) + '</div>' +
    '<div class="zl-date">' + esc(t.zlPub) + ' ' + esc(data) + '</div>' +
    '<span class="zl-lab">' + esc(t.stChar) + '</span>' +
    '<div class="zl-dd"><button type="button" data-act="open" aria-expanded="' + st.open + '">' + IC.user + '<span>' + esc(r.nome) + '</span><i class="chev"></i></button>' +
      (st.open ? '<div class="zl-menu" role="listbox">' + menu + '</div>' : '') + '</div>' +
    prev(t.stMain, r.prev.main) +
    prev(t.stVar, r.prev.vars) +
    (r.prev.nota ? '<p class="st-note">' + esc(r.prev.nota) + '</p>' : '') +
    (arquivos ? '<div class="zl-ftitle">' + IC.down + '<span>' + esc(t.stFiles) + '</span></div>' + arquivos : '');
  menuRolar(el);
}

/* leva a lista aberta até o item marcado */
function menuRolar(raiz){
  const m = raiz.querySelector(".zl-menu"); if (!m) return;
  const sel = m.querySelector('[aria-selected="true"]'); if (!sel) return;
  m.scrollTop = Math.max(0, sel.offsetTop - (m.clientHeight - sel.offsetHeight) / 2);
}

async function stCarregar(forcar){
  if (st.carregando) return;
  if (st.rels && !forcar && Date.now() - st.t < 300000) return;
  st.carregando = true; stRender();
  try{
    const r = await fetch(ST_API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const lista = (await r.json()).filter(x => !x.draft);
    const rels = lista.map(x => {
      let as = x.assets || [];
      const zips = as.filter(a => /\.zip$/i.test(a.name));
      if (zips.length) as = zips;
      return {
        tag: x.tag_name,
        nome: String(x.name || x.tag_name).replace(/^Setinhas\s+(da|de|do|das|dos)\s+/i, "").trim() || x.tag_name,
        date: x.published_at,
        prev: stParse(x.body),
        files: as.map(a => ({ name: a.name, size: a.size, dl: a.download_count, url: a.browser_download_url }))
      };
    });
    if (!rels.length) throw new Error("vazio");
    st.rels = rels; st.t = Date.now();
  }catch(e){}
  st.carregando = false; stRender();
}
document.getElementById("stCard").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "retry"){ stCarregar(true); return; }
  if (a === "open") st.open = !st.open;
  else if (a === "pick"){ st.sel = b.dataset.id; st.open = false; }
  stRender();
});
/* o clique já pode ter trocado o HTML do card, então olha o caminho original do evento */
function clicouNoMenu(e, cardId){
  const p = e.composedPath ? e.composedPath() : [];
  return p.some(n => n.id === cardId) && p.some(n => n.classList && n.classList.contains("zl-dd"));
}
document.addEventListener("click", e => {
  if (st.open && !clicouNoMenu(e, "stCard")){ st.open = false; stRender(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && st.open){ st.open = false; stRender(); } });


/* ============ WALLPAPERS ANIMADOS (releases direto do GitHub) ============ */
const WL_API = "https://api.github.com/repos/RussoViller/Wallpapers-For-ZL2/releases?per_page=100";
IC.film = '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>';
const wl = { rels: null, carregando: false, t: 0, sel: null, open: false };

/* acha o vídeo/foto de preview e as anotações no texto da release */
function wlParse(body){
  body = body || "";
  const pv = stParse(body);
  const fotos = pv.main.concat(pv.vars);
  const vids = [];
  let m;
  const vre = /<(?:video|source)\b[^>]*?\bsrc=["']([^"']+)["']/gi;
  while ((m = vre.exec(body))) vids.push(m[1]);
  const dre = /(https?:\/\/[^\s)"'<>]+\.(?:mp4|webm|mov)(?:\?[^\s)"'<>]*)?)/gi;
  while ((m = dre.exec(body))) vids.push(m[1]);
  const are = /https:\/\/github\.com\/(?:user-attachments\/assets|[^\s\/]+\/[^\s\/]+\/assets)\/[0-9a-f-]{8,}/gi;
  while ((m = are.exec(body))){
    const u = m[0];
    if (!fotos.some(f => f.indexOf(u) === 0)) vids.push(u);
  }
  const nota = body
    .replace(/<[^>]+>/g, " ")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/https?:\/\/\S+/g, " ")
    .split(/\r?\n/)
    .map(l => l.replace(/^\s*#{1,6}\s*/, "").replace(/^\s*[*\-]\s+/, "• ").trim())
    .filter(Boolean);
  return { vids: vids.filter((u, i) => vids.indexOf(u) === i), fotos, nota };
}

function wlDdHtml(r){
  const t = T[lang];
  const menu = wl.rels.map(x => '<button type="button" role="option" data-act="pick" data-id="' + esc(x.tag) + '" aria-selected="' + (x.tag === wl.sel) + '"><span><b>' + esc(x.nome) + '</b></span>' + (x.tag === wl.sel ? IC.ok : "") + '</button>').join("");
  return '<button type="button" data-act="open" aria-expanded="' + wl.open + '">' + IC.film + '<span>' + esc(r.nome) + '</span><i class="chev"></i></button>' +
    (wl.open ? '<div class="zl-menu" role="listbox">' + menu + '</div>' : '');
}

function wlRender(){
  const el = document.getElementById("wlCard");
  if (!el) return;
  const t = T[lang];
  if (!wl.rels){
    el.innerHTML = wl.carregando
      ? '<p class="zl-msg">' + esc(t.wlLoading) + '</p>'
      : '<p class="zl-msg">' + esc(t.zlError) + '</p><button type="button" class="btn" data-act="retry">' + esc(t.zlRetry) + '</button>';
    return;
  }
  if (!wl.rels.some(r => r.tag === wl.sel)) wl.sel = wl.rels[0].tag;
  const r = wl.rels.find(x => x.tag === wl.sel);
  const fl = HTMLLANG[lang];
  const data = r.date ? new Date(r.date).toLocaleDateString(fl, { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  let prev = "";
  if (r.prev.vids.length){
    prev = '<video src="' + esc(r.prev.vids[0]) + '" controls autoplay muted loop playsinline preload="metadata"></video>';
  } else if (r.prev.fotos.length){
    prev = r.prev.fotos.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:100%;border-radius:12px;display:block">').join("");
  } else if (r.vidAsset){
    prev = '<video src="' + esc(r.vidAsset) + '" controls muted loop playsinline preload="none"></video>';
  } else {
    prev = '<span class="zl-msg">' + esc(t.stNoPrev) + '</span>';
  }
  const arquivos = r.files.map(f => {
    const mb = (f.size / 1048576).toLocaleString(fl, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return '<div class="zl-file"><div class="zl-ftop"><div class="zl-ficon dk"><img src="' + WALL_BTN_IMG + '" alt=""></div><div><div class="zl-fname">' + esc(f.name) + '</div><div class="zl-meta"><span>' + mb + ' MB</span><span>' + f.dl.toLocaleString(fl) + ' ' + esc(t.zlDl) + '</span></div></div></div>'
      + '<a class="zl-get" href="' + esc(f.url) + '" rel="noopener">' + esc(t.zlGet) + ' ' + IC.ext + '</a></div>';
  }).join("");
  el.innerHTML =
    '<div class="zl-ver">' + esc(r.nome) + '</div>' +
    '<div class="zl-date">' + esc(t.zlPub) + ' ' + esc(data) + '</div>' +
    '<span class="zl-lab">' + esc(t.wlPick) + '</span>' +
    '<div class="zl-dd" id="wlDd">' + wlDdHtml(r) + '</div>' +
    '<span class="zl-lab">' + esc(t.wlPrev) + '</span><div class="wl-prev" data-url="' + esc(r.url) + '">' + prev + '</div>' +
    (r.prev.nota.length ? '<p class="st-note">' + r.prev.nota.map(esc).join("<br>") + '</p>' : '') +
    (arquivos ? '<div class="zl-ftitle">' + IC.down + '<span>' + esc(t.stFiles) + '</span></div>' + arquivos : '');
}

async function wlCarregar(forcar){
  if (wl.carregando) return;
  if (wl.rels && !forcar && Date.now() - wl.t < 300000) return;
  wl.carregando = true; wlRender();
  try{
    const r = await fetch(WL_API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const lista = (await r.json()).filter(x => !x.draft);
    const rels = lista.map(x => {
      const as = x.assets || [];
      const v = as.find(a => /\.(mp4|webm|mov)$/i.test(a.name));
      return {
        tag: x.tag_name,
        nome: String(x.name || x.tag_name).trim() || x.tag_name,
        date: x.published_at,
        url: x.html_url,
        prev: wlParse(x.body),
        vidAsset: v ? v.browser_download_url : "",
        files: as.map(a => ({ name: a.name, size: a.size, dl: a.download_count, url: a.browser_download_url }))
      };
    });
    if (!rels.length) throw new Error("vazio");
    wl.rels = rels; wl.t = Date.now();
  }catch(e){}
  wl.carregando = false; wlRender();
}
(function(){
  const el = document.getElementById("wlCard");
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const a = b.dataset.act;
    if (a === "retry"){ wlCarregar(true); return; }
    if (a === "open"){
      wl.open = !wl.open;
      const r = wl.rels.find(x => x.tag === wl.sel);
      const dd = document.getElementById("wlDd");
      dd.innerHTML = wlDdHtml(r); menuRolar(dd);
    } else if (a === "pick"){
      wl.sel = b.dataset.id; wl.open = false; wlRender();
    }
  });
  /* se o vídeo não carregar, oferece abrir direto no GitHub */
  el.addEventListener("error", e => {
    const v = e.target;
    if (!v || v.tagName !== "VIDEO") return;
    const box = v.closest(".wl-prev"); if (!box) return;
    const t = T[lang];
    box.innerHTML = '<span class="zl-msg">' + esc(t.wlFail) + ' <a href="' + esc(box.dataset.url || "#") + '" target="_blank" rel="noopener">' + esc(t.wlOpen) + '</a></span>';
  }, true);
  document.addEventListener("click", e => {
    if (wl.open && !clicouNoMenu(e, "wlCard")){
      wl.open = false;
      const r = wl.rels && wl.rels.find(x => x.tag === wl.sel);
      const dd = document.getElementById("wlDd");
      if (r && dd) dd.innerHTML = wlDdHtml(r);
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && wl.open){
      wl.open = false;
      const r = wl.rels && wl.rels.find(x => x.tag === wl.sel);
      const dd = document.getElementById("wlDd");
      if (r && dd) dd.innerHTML = wlDdHtml(r);
    }
  });
})();

const hd = { rel: null, carregando: false, t: 0 };

function hdRender(){
  const el = document.getElementById("hdCard");
  if (!el) return;
  const t = T[lang];
  if (!hd.rel){
    el.innerHTML = hd.carregando
      ? '<p class="zl-msg">' + esc(t.zlLoading) + '</p>'
      : '<p class="zl-msg">' + esc(t.zlError) + '</p><button type="button" class="btn" data-act="retry">' + esc(t.zlRetry) + '</button>';
    return;
  }
  const r = hd.rel, fl = HTMLLANG[lang];
  const data = r.date ? new Date(r.date).toLocaleDateString(fl, { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  const imgs = r.imgs.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy" referrerpolicy="no-referrer">').join("");
  const arquivos = r.files.map(f => {
    const mb = (f.size / 1048576).toLocaleString(fl, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return '<div class="zl-file"><div class="zl-ftop"><div class="zl-ficon">' + HUD_ICON + '</div><div><div class="zl-fname">' + esc(f.name) + '</div><div class="zl-meta"><span>' + mb + ' MB</span><span>' + f.dl.toLocaleString(fl) + ' ' + esc(t.zlDl) + '</span></div></div></div>'
      + '<a class="zl-get" href="' + esc(f.url) + '" rel="noopener">' + esc(t.zlGet) + ' ' + IC.ext + '</a></div>';
  }).join("");
  el.innerHTML =
    '<div class="zl-ver">' + esc(r.nome) + '</div>' +
    '<div class="zl-date">' + esc(t.zlPub) + ' ' + esc(data) + '</div>' +
    '<span class="zl-lab">' + esc(t.hdPrev) + '</span><div class="st-prev">' + (imgs || '<span class="zl-msg" style="padding:0">' + esc(t.stNoPrev) + '</span>') + '</div>' +
    (arquivos ? '<div class="zl-ftitle">' + IC.down + '<span>' + esc(t.stFiles) + '</span></div>' + arquivos : '');
}

async function hdCarregar(forcar){
  if (hd.carregando) return;
  if (hd.rel && !forcar && Date.now() - hd.t < 300000) return;
  hd.carregando = true; hdRender();
  try{
    const r = await fetch(HD_API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const x = (await r.json()).filter(v => !v.draft)[0];
    if (!x) throw new Error("vazio");
    const pv = stParse(x.body);
    let fotos = pv.main.concat(pv.vars);
    if (!fotos.length) fotos = (x.assets || []).filter(a => /\.(png|jpe?g|webp|gif)$/i.test(a.name)).map(a => a.browser_download_url);
    hd.rel = {
      nome: String(x.name || x.tag_name).trim(),
      date: x.published_at,
      imgs: fotos,
      files: (x.assets || []).map(a => ({ name: a.name, size: a.size, dl: a.download_count, url: a.browser_download_url }))
    };
    hd.t = Date.now();
  }catch(e){}
  hd.carregando = false; hdRender();
}
document.getElementById("hdCard").addEventListener("click", e => {
  if (e.target.closest('[data-act="retry"]')) hdCarregar(true);
});


/* ============ MOBILEGLUES (versões direto do GitHub oficial, sempre atualizadas) ============ */
const MG_API = "https://api.github.com/repos/MobileGL-Dev/MobileGlues-release/releases?per_page=100";
const MG_LOGO = "https://avatars.githubusercontent.com/u/203398288?s=128";
IC.tag = '<svg class="ic" viewBox="0 0 24 24"><path d="M3 12.5V4h8.5L21 13.5 13.5 21z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>';
const mg = { rels: null, carregando: false, t: 0, sel: null, open: false, manual: false, foto: "" };

function mgIco(){ return mg.foto ? '<img src="' + esc(mg.foto) + '" alt="">' : "MG"; }
function mgUltima(){ return mg.rels.find(r => !r.pre) || mg.rels[0]; }

function mgRender(){
  const el = document.getElementById("mgCard");
  if (!el) return;
  const t = T[lang];
  if (!mg.rels){
    el.innerHTML = mg.carregando
      ? '<p class="zl-msg">' + esc(t.mgLoading) + '</p>'
      : '<p class="zl-msg">' + esc(t.zlError) + '</p><button type="button" class="btn" data-act="retry">' + esc(t.zlRetry) + '</button>';
    return;
  }
  const ultima = mgUltima();
  /* sem escolha manual, sempre mostra a versão estável mais recente */
  if (!mg.manual || !mg.rels.some(r => r.tag === mg.sel)) mg.sel = ultima.tag;
  const r = mg.rels.find(x => x.tag === mg.sel);
  const fl = HTMLLANG[lang];
  const data = r.date ? new Date(r.date).toLocaleDateString(fl, { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  const selo = x => x.tag === ultima.tag ? t.mgLatest : (x.pre ? t.mgPre : "");
  const menu = mg.rels.map(x => '<button type="button" role="option" data-act="pick" data-id="' + esc(x.tag) + '" aria-selected="' + (x.tag === mg.sel) + '"><span><b>' + esc(x.nome) + '</b>' + (selo(x) ? '<small class="pill">' + esc(selo(x)) + '</small>' : '') + '</span>' + (x.tag === mg.sel ? IC.ok : '') + '</button>').join("");
  const arquivos = r.files.map(f => {
    const mb = (f.size / 1048576).toLocaleString(fl, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return '<div class="zl-file"><div class="zl-ftop"><div class="zl-ficon mgf' + (mg.foto ? ' tem-foto' : '') + '">' + mgIco() + '</div><div><div class="zl-fname">' + esc(f.name) + '</div><div class="zl-meta"><span>' + mb + ' MB</span><span>' + Number(f.dl || 0).toLocaleString(fl) + ' ' + esc(t.zlDl) + '</span></div></div></div>'
      + '<a class="zl-get" href="' + esc(f.url) + '" rel="noopener">' + esc(t.zlGet) + ' ' + IC.ext + '</a></div>';
  }).join("") || '<p class="zl-msg">' + esc(t.zlNone) + '</p>';
  el.innerHTML =
    '<div class="zl-ver">' + esc(r.nome) + '</div>' +
    '<div class="zl-date">' + esc(t.zlPub) + ' ' + esc(data) + (selo(r) ? ' · ' + esc(selo(r)) : '') + '</div>' +
    '<span class="zl-lab">' + esc(t.mgVersion) + '</span>' +
    '<div class="zl-dd"><button type="button" data-act="open" aria-expanded="' + mg.open + '">' + IC.tag + '<span>' + esc(r.nome) + '</span><i class="chev"></i></button>' +
      (mg.open ? '<div class="zl-menu" role="listbox">' + menu + '</div>' : '') + '</div>' +
    '<div class="zl-ftitle">' + IC.down + '<span>' + esc(t.zlFiles) + '</span></div>' + arquivos;
  menuRolar(el);
}

async function mgCarregar(forcar){
  if (mg.carregando) return;
  if (mg.rels && !forcar && Date.now() - mg.t < 300000) return;
  mg.carregando = true; mgRender();
  try{
    const r = await fetch(MG_API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const lista = (await r.json()).filter(x => !x.draft);
    const rels = lista.map(x => {
      let as = x.assets || [];
      const apks = as.filter(a => /\.apk$/i.test(a.name));
      if (apks.length) as = apks;
      const tag = String(x.tag_name || "");
      return {
        tag: tag,
        nome: "MobileGlues " + tag.replace(/^v/i, "").replace(/\.RC(\d+)/i, " RC $1"),
        date: x.published_at,
        pre: !!x.prerelease,
        files: as.map(a => ({ name: a.name, size: a.size, dl: a.download_count, url: a.browser_download_url }))
      };
    });
    if (!rels.length) throw new Error("vazio");
    mg.rels = rels; mg.t = Date.now();
  }catch(e){}
  mg.carregando = false; mgRender();
}
document.getElementById("mgCard").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "retry"){ mgCarregar(true); return; }
  if (a === "open") mg.open = !mg.open;
  else if (a === "pick"){
    mg.sel = b.dataset.id; mg.open = false;
    mg.manual = !!mg.rels && b.dataset.id !== mgUltima().tag;
  }
  mgRender();
});
document.addEventListener("click", e => {
  if (mg.open && !clicouNoMenu(e, "mgCard")){ mg.open = false; mgRender(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && mg.open){ mg.open = false; mgRender(); } });

/* logo do MobileGlues no botão e nos arquivos (ou um arquivo seu: mobileglues.png) */
carregarImg([MG_LOGO].concat(EXTS.map(e => "mobileglues." + e))).then(im => {
  if (!im) return;
  mg.foto = im.src;
  const ic = document.getElementById("icMg");
  ic.classList.add("tem-foto"); ic.innerHTML = mgIco();
  mgRender();
});

/* ============ CONFIGURAÇÕES: força do Fade in (padrão 1, máximo 5) ============ */
const FADE_PADRAO = 1, FADE_MAX = 5;
let fade = FADE_PADRAO;
try { const f = parseInt(localStorage.getItem("fade"), 10); if (f >= 1 && f <= FADE_MAX) fade = f; } catch (e) {}
const fadeRange = document.getElementById("fadeRange");
const fadeOut = document.getElementById("fadeOut");
function aplicarFade(n){
  fade = Math.min(FADE_MAX, Math.max(1, Math.round(Number(n)) || FADE_PADRAO));
  document.documentElement.style.setProperty("--fade", fade);
  fadeRange.value = fade;
  fadeRange.style.setProperty("--p", ((fade - 1) / (FADE_MAX - 1) * 100) + "%");
  fadeOut.textContent = fade;
  fadeRange.setAttribute("aria-valuetext", fade + " / " + FADE_MAX);
}
function guardarFade(){ try { localStorage.setItem("fade", fade); } catch (e) {} }
/* repete a animação da tela de configurações para mostrar o efeito na hora */
function repetirFade(){
  const v = document.getElementById("config");
  if (!v.classList.contains("active")) return;
  v.classList.remove("active"); void v.offsetWidth; v.classList.add("active");
}
fadeRange.addEventListener("input", () => { aplicarFade(fadeRange.value); guardarFade(); });
fadeRange.addEventListener("change", repetirFade);
document.getElementById("fadeTest").addEventListener("click", repetirFade);
document.getElementById("fadeReset").addEventListener("click", () => { aplicarFade(FADE_PADRAO); guardarFade(); repetirFade(); });
aplicarFade(fade);

/* ============ VISITAS (contador global: Abacus) ============ */

const VIS_MIN = 0, VIS_MAX = 10000000;
const visLimite = n => Math.min(VIS_MAX, Math.max(VIS_MIN, Math.floor(Number(n)) || 0));
const VIS_URL = "https://abacus.jasoncameron.dev/hit/" + VIS_NS + "/" + VIS_KEY; /* contador único e global: sobe 1 a cada entrada ou atualização */
let visitas = null, visFalhou = false;
try { const c = parseInt(localStorage.getItem("visitasGlobal"), 10); if (c >= 0) visitas = visLimite(c); } catch (e) {} /* mostra na hora o último número visto */
function visitasRender(){

/* >>> Firebase (Realtime Database): cole aqui a URL do seu banco. Vazio = usa Supabase (se preenchido) ou Abacus. <<< */
const FIREBASE_URL = "";
const usaFb = !!FIREBASE_URL;
/* >>> Supabase (opcional): URL do projeto e chave "publishable" (ou "anon"). <<< */
const SUPABASE_URL = "https://knecfrlrnosjehvrhqot.supabase.co";
const SUPABASE_KEY = "sb_publishable_mojeFGK6e5Gk3RjYM-iVbg_6K7dkGsg";
const usaSb = !!(SUPABASE_URL && SUPABASE_KEY);
async function visitasBuscar(){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
  const o = { signal: c.signal, cache: "no-store" };
  try{
    let j;
    if (usaFb){
      const u = FIREBASE_URL.replace(/\/+$/, "") + "/visitas.json";
      const r = await fetch(u, { ...o, method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ".sv": { increment: 1 } }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      j = await r.json();
      if (typeof j !== "number"){
        const g = await fetch(u, o);
        if (!g.ok) throw new Error("HTTP " + g.status);
        j = await g.json();
      }
    } else {
      const r = usaSb
        ? await fetch(SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/hit_visitas", { ...o, method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: "{}" })
        : await fetch(VIS_URL, o);
      if (!r.ok) throw new Error("HTTP " + r.status);
      j = await r.json();
    }
    if (Array.isArray(j)) j = j[0];
    const n = Number(j !== null && typeof j === "object" ? (j.value != null ? j.value : j.hit_visitas) : j);
    if (!isFinite(n)) throw new Error("formato");
    return visLimite(n);
  } finally { clearTimeout(t); }
}
async function visitasCarregar(){

/* ============ ÁUDIO: música ambiente suave (gerada no navegador) ============ */
const VOL_PADRAO = 60, VOL_MIN = 10, VOL_MAX = 100;
let musicaOn = true, vol = VOL_PADRAO;
try {
  musicaOn = localStorage.getItem("musica") !== "off";
  const v = parseInt(localStorage.getItem("vol"), 10);
  if (v >= VOL_MIN && v <= VOL_MAX) vol = v;
} catch (e) {}
const ACORDES = [[48,55,59,64,67],[45,52,60,64,67],[41,48,57,60,64],[43,50,59,62,64]]; /* Cmaj7 · Am7 · Fmaj7 · G6 */
const BELLS = [72,74,76,79,81];
let ac = null, master = null, eco = null, acordeI = 0, relogio = null;
const hz = n => 440 * Math.pow(2, (n - 69) / 12);
const ganho = () => Math.pow(vol / 100, 2);

function nota(freq, t, dur, pico, destino, tipo, ataque){
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(pico, t + (ataque || dur * .35));
  g.gain.linearRampToValueAtTime(0, t + dur);
  g.connect(destino);
  [-3, 3].forEach(c => {
    const o = ac.createOscillator();
    o.type = tipo; o.frequency.value = freq; o.detune.value = c;
    o.connect(g); o.start(t); o.stop(t + dur + .1);
  });
}
function acorde(){
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime + .05;
  const prim = acordeI === 0; /* primeiro acorde entra rápido; os demais, bem devagar */
  ACORDES[acordeI % ACORDES.length].forEach((n, i) => nota(hz(n), t + (prim ? 0 : i * .4), 16, .022, master, "sine", prim ? 1 : 5));
  const b = ac.createGain(); b.gain.value = 1; b.connect(master); b.connect(eco);
  {
    const n = BELLS[Math.floor(Math.random() * BELLS.length)];
    const tt = t + 4 + Math.random() * 3;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(.028, tt + .6); g.gain.exponentialRampToValueAtTime(.0005, tt + 7);
    g.connect(b);
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = hz(n);
    o.connect(g); o.start(tt); o.stop(tt + 7.2);
  }
  acordeI++;
}
function criarCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error("sem áudio");
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 950;
  master.connect(lp); lp.connect(ac.destination);
  eco = ac.createDelay(1); eco.delayTime.value = .7;
  const fb = ac.createGain(); fb.gain.value = .4;
  eco.connect(fb); fb.connect(eco); eco.connect(master);
}
function ligar(){
  if (!musicaOn || !ac || ac.state !== "running") return;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(ganho(), ac.currentTime, .4);
  if (!relogio){ acorde(); relogio = setInterval(acorde, 12000); }
  EVT_AUDIO.forEach(ev => document.removeEventListener(ev, destravar, true));
}
function musicaIniciar(){
  if (!musicaOn) return;
  try{
    if (!ac || ac.state === "closed") criarCtx();
    if (ac.state === "running") ligar(); else ac.resume().then(ligar).catch(() => {});
  }catch(e){}
}
function musicaParar(){
  if (!ac) return;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(0, ac.currentTime, .35);
  setTimeout(() => { if (!musicaOn && ac) ac.suspend(); }, 1600);
}
const musicaBtn = document.getElementById("musicaBtn");
const volRange = document.getElementById("volRange");
const volOut = document.getElementById("volOut");
function aplicarMusicaUI(){
  musicaBtn.setAttribute("aria-checked", musicaOn);
  document.getElementById("musicaTxt").textContent = musicaOn ? "ON" : "OFF";
}
function aplicarVol(n){
  vol = Math.min(VOL_MAX, Math.max(VOL_MIN, Math.round(Number(n)) || VOL_PADRAO));
  volRange.value = vol;
  volRange.style.setProperty("--p", ((vol - VOL_MIN) / (VOL_MAX - VOL_MIN) * 100) + "%");
  volOut.textContent = vol + "%";
  volRange.setAttribute("aria-valuetext", vol + "%");
  if (ac && musicaOn) master.gain.setTargetAtTime(ganho(), ac.currentTime, .05);
}
musicaBtn.addEventListener("click", () => {
  musicaOn = !musicaOn;
  try { localStorage.setItem("musica", musicaOn ? "on" : "off"); } catch (e) {}
  aplicarMusicaUI();
  musicaOn ? musicaIniciar() : musicaParar();
});
volRange.addEventListener("input", () => {
  aplicarVol(volRange.value);
  try { localStorage.setItem("vol", vol); } catch (e) {}
});
document.addEventListener("visibilitychange", () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (musicaOn) ac.resume();
});
/* navegadores só liberam áudio depois de um toque/clique: começa na primeira interação */
const EVT_AUDIO = ["pointerdown","pointerup","click","keydown","touchend"];
function destravar(){ musicaIniciar(); }
EVT_AUDIO.forEach(ev => document.addEventListener(ev, destravar, true));
/* tenta tocar assim que a página abre; se o navegador bloquear, descarta e toca no primeiro toque/clique/tecla */
try{
  criarCtx();
  ac.resume().then(ligar).catch(() => {});
  setTimeout(() => { if (ac && ac.state !== "running"){ try { ac.close(); } catch (e) {} ac = null; master = null; eco = null; } }, 500);
}catch(e){}
aplicarMusicaUI();
aplicarVol(vol);
visitasCarregar();

traduzir();
ir(location.hash.slice(1) || "inicio", true);
</script>

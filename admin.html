<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Avaliações</title>
<style>
:root{--bg:#0b0b0d;--card:#16161a;--line:#2a2a31;--text:#f2f2f4;--mut:#9a9aa5;--red:#e5333f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 14px}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
button{padding:12px 16px;border-radius:12px;border:0;background:var(--red);color:#fff;font:inherit;font-weight:600}
button.del{background:#3a1216;color:#ff7b84;padding:8px 12px;font-size:.9rem}
.msg{min-height:1.3em;margin:6px 0 12px;color:var(--mut);font-size:.9rem}
.msg.err{color:#ff7b84}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.it header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.it .st{color:#ffc24d}.it time{color:var(--mut);font-size:.8rem;margin-left:auto}
.it p{margin:0 0 10px;word-break:break-word}
</style>
</head>
<body>
<h1>Admin · Avaliações</h1>
<div class="row"><input id="k" type="password" placeholder="Senha de admin" autocomplete="current-password"><button id="go">Carregar</button></div>
<div class="msg" id="m"></div>
<div id="l"></div>
<script>
const API = "https://twilight-shadow-c38e.ninjax13ofc.workers.dev";
const $ = id => document.getElementById(id);
let KEY = "";
const msg = (t, e) => { $("m").textContent = t || ""; $("m").className = "msg" + (e ? " err" : ""); };
async function call(body){
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, key: KEY }) });
  if (r.status === 401) throw new Error("Senha errada. Aguarde 1 minuto para tentar de novo.");
  if (r.status === 429) throw new Error("Muitas tentativas. Aguarde 1 minuto.");
  if (r.status === 403) throw new Error("ADMIN_KEY ainda não foi criada no Cloudflare.");
  if (!r.ok) throw new Error("Erro " + r.status);
  return r.json();
}
function draw(list){
  const box = $("l"); box.textContent = "";
  if (!list.length){ msg("Nenhuma avaliação."); return; }
  msg(list.length + " avaliações");
  list.forEach(x => {
    const it = document.createElement("div"); it.className = "it";
    const h = document.createElement("header");
    const n = document.createElement("b"); n.textContent = x.name;
    const st = document.createElement("span"); st.className = "st"; st.textContent = "★".repeat(x.stars) + "☆".repeat(5 - x.stars);
    const d = document.createElement("time"); d.textContent = new Date(x.ts).toLocaleString("pt-BR");
    h.append(n, st, d);
    const p = document.createElement("p"); p.textContent = x.text;
    const b = document.createElement("button"); b.className = "del"; b.textContent = "Apagar";
    b.onclick = async () => {
      if (!confirm("Apagar a avaliação de " + x.name + "?")) return;
      b.disabled = true;
      try { await call({ action: "delete", ts: x.ts, name: x.name }); it.remove(); msg("Apagada."); }
      catch (e) { msg(e.message, true); b.disabled = false; }
    };
    it.append(h, p, b); box.appendChild(it);
  });
}
$("go").onclick = async () => {
  KEY = $("k").value; msg("Carregando…");
  try { draw(await call({ action: "list" })); } catch (e) { msg(e.message, true); }
};
</script>
</body>
</html>
